[versions]
# Core SDK deps (or common):
acinqSecp256k1 = "0.10.1"
androidGradlePlugin = "8.10.0"
appAuth = "0.11.1"
buildKonfig = "0.13.3"
dataStore = "1.0.0"
desugar_jdk_libs = "2.0.3"
dokka = "1.9.0"
downloadFile = "5.4.0"
gradleS3 = "1.2.1"
jna = "5.13.0"
kase64 = "1.0.6"
kotest = "5.5.4"
kotlin = "1.9.20"
kotlinCompilerExtension = "1.4.0"
kotlinCoroutines = "1.7.2"
kotlinxDateTime = "0.4.0"
kotlinSerializationJson = "1.4.1"
ktlint = "11.3.1"
ktor = "2.3.7"
lightsparkCore = "0.6.1"
lightsparkCrypto = "0.6.0"
uma = "1.5.0"
mavenPublish = "0.32.0"
mockitoCore = "5.5.0"
taskTree = "2.1.1"

[libraries]
desugar_jdk_libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar_jdk_libs" }

gradleClasspath-android = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
gradleClasspath-dokka = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
gradleClasspath-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }
gradleClasspath-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradleClasspath-mavenPublish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }
gradleClasspath-downloadFile = { module = "de.undercouch.download:de.undercouch.download.gradle.plugin", version.ref = "downloadFile" }

androidx-compose-ui-util = { module = "androidx.compose.ui:ui-util" }

acinq-secp256k1 = { module = "fr.acinq.secp256k1:secp256k1-kmp", version.ref = "acinqSecp256k1" }
acinq-secp256k1-jni-jvm = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-jvm", version.ref = "acinqSecp256k1" }
acinq-secp256k1-jni-android = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-android", version.ref = "acinqSecp256k1" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "dataStore" }

task-tree = { module = "com.dorongold.plugins:task-tree", version.ref = "taskTree" }

kase64 = { module = "de.peilicke.sascha:kase64", version.ref = "kase64" }
appauth = { module = "net.openid:appauth", version.ref = "appAuth" }

kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinSerializationJson" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDateTime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinCoroutines" }
kotlinx-coroutines-jdk8 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8", version.ref = "kotlinCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinCoroutines" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-serialization = { module = "io.ktor:ktor-client-serialization", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }

kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

lightspark-core = { module = "com.lightspark:lightspark-core", version.ref = "lightsparkCore" }
lightspark-crypto = { module = "com.lightspark:lightspark-crypto", version.ref = "lightsparkCrypto" }
uma = { module = "me.uma:uma-sdk-jvm", version.ref = "uma" }

mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockitoCore" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "androidGradlePlugin" }
buildKonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildKonfig" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinKapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
gradleS3 = { id = "com.mgd.core.gradle.s3", version.ref = "gradleS3" }
downloadFile = { id = "de.undercouch.download", version.ref = "downloadFile" }
